location = "uv run --project . vgi-rugby"
select = ["ALL"]
fail_on = "warning"

ignore = [
  { code = "VGI311", kind = "tooling-bug", reason = """\
Each parameterless all_* scan is exposed as its corresponding table (all_current_world_rankings \
as current_world_rankings, all_current_matches as current_matches, all_current_standings as \
current_standings, all_competitions as competitions). The rule only recognizes matching names, \
but a function and a table cannot share a name inside one schema; the deliberate all_* names \
avoid those collisions.\
""" },
  { code = "VGI520", kind = "domain-exemption", reason = """\
Agent tasks exercise the public tables, which invoke these all_* backing scans. Directly teaching \
agents to call implementation functions would undermine the table abstraction; the hermetic \
Haybarn E2E test separately executes every backing scan through its table.\
""" },
]
